name: Daily YouTube Scrape

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scraper.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add videos.json
          git commit -m "🎬 Daily YouTube scrape - $(date)" || echo "No changes"
          git push
      
      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<EOF
          import requests
          import json
          import sys
          
          # Read the scraped data
          try:
              with open('videos.json', 'r') as f:
                  data = json.load(f)
                  count = data.get('total_videos', 0)
          except Exception as e:
              print(f"Error reading videos.json: {e}")
              sys.exit(1)
          
          # Prepare message
          message = f"✅ Daily scrape complete!\n📺 Found {count} relevant videos"
          
          # Send to Telegram
          bot_token = "${{ secrets.TELEGRAM_TOKEN }}"
          chat_id = "${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if not bot_token or not chat_id:
              print("ERROR: TELEGRAM_TOKEN or TELEGRAM_CHAT_ID not set")
              sys.exit(1)
          
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML"
          }
          
          print(f"Sending to Telegram...")
          print(f"Chat ID: {chat_id}")
          print(f"Message: {message}")
          
          response = requests.post(url, json=payload, timeout=10)
          
          print(f"Response status: {response.status_code}")
          print(f"Response body: {response.text}")
          
          if response.status_code != 200:
              print(f"ERROR: Telegram API returned {response.status_code}")
              sys.exit(1)
          
          result = response.json()
          if result.get('ok'):
              print("✅ Telegram notification sent successfully")
          else:
              print(f"ERROR: {result.get('description', 'Unknown error')}")
              sys.exit(1)
          EOF
